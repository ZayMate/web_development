<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Iphone 14 Colors </title>
</head>
<body>

    <input type="radio" name="theme" id="deep-purple" checked="checked">
    <input type="radio" name="theme" id="gold">
    <input type="radio" name="theme" id="space-black">
    <input type="radio" name="theme" id="silver">

    <div class="phone">
        <div class="buttons">
            <div class="left">
                <div class="button"></div>
                <div class="button"></div>
                <div class="button"></div>
            </div>
            <div class="right">
                <div class="button"></div>
            </div>
        </div>
        <div class="camera"></div>
        <div class="screen-container">
            <div class="bg">
                <div class="deep-purple">
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                </div>
                <div class="gold">
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                </div>
                <div class="space-black">
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                </div>
                <div class="silver">
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                    <div class="section">
                        <div class="glow"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notch-container" tabindex="0">
            <div class="notch">
                <div class="content">
                    <div class="left">
                        <div class="title"></div>
                        <div class="text"></div>
                    </div>
                    <div class="right">

                    </div>
                        <div class="bar">
                            <div class="duration"></div>    
                        </div>   
                    </div>
                </div>

            <div class="notch-blur"></div>

        </div>
    </div>

    <div class="pallette">
        <label for="deep-purple" class="swatch" style="--swatch-s1: hsl(284, 100%, 50%); --swatch-s2: hsl(224, 100%, 20%);"></label>
        <label for="gold" class="swatch" style="--swatch-s1: hsl(30, 100%, 50%); --swatch-s2: hsl(30, 100%, 50%);"></label>
        <label for="space-black" class="swatch" style="--swatch-s1: hsl(215, 50%, 20%); --swatch-s2: hsl(215, 50%, 10%);"></label>
        <label for="silver" class="swatch" style="--swatch-s1: hsl(254, 50%, 80%); --swatch-s2: hsl(254, 50%, 10%);"></label>
    </div>
</body>
</html>
